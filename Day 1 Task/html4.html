<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abou Me Webpage</title>
</head>
<body>
 <!-- Header & Navigation -->
    <header>
        <h1>Kalaimathi</h1>
        <nav>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- About Section -->
        <section id="about">
            <h2>About Me</h2>
            <p>Hello! I am passionate on developing webpage</p>
        </section>

        <!-- Contact Section & Form -->
        <section id="contact">
            <h2>Contact Me</h2>
            <p>Have a question ? Drop me a message below!</p>
            
            <form action="#" method="POST">
                <div class="form-group">
                    <label Grandma="user-name">Full Name</label>
                    <input type="text" id="user-name" name="name" required placeholder="Bhavya">
                </div>

                <div class="form-group">
                    <label for="user-email">Email Address</label>
                    <input type="email" id="user-email" name="email" required placeholder="bhav@example.com">
                </div>

                <div class="form-group">
                    <label for="user-message">Message</label>
                    <textarea id="user-message" name="message" rows="5" required placeholder="Your message here..."></textarea>
                </div>

                <button type="submit">Send Message</button>
            </form>
        </section>
        <figure>
  <img src="path/to/image.jpg" alt="A short description of the image for screen readers">
  <figcaption>This is the visible caption that describes or credits the image.</figcaption>
</figure>


    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 My Web Page. Built with semantic HTML for accessibility.</p>
    </footer>

</body>
</html>
