<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Class Schedule</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 12px;
        }
        thead {
            background-color: #f2f2f2;
        }
        th {
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <h2>Weekly Class Schedule</h2>

    <table>
        <thead>
            <tr>
                <th scope="col">Day</th>
                <th scope="col">Topic</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Monday</td>
                <td>Introduction to HTML & Web Structure</td>
            </tr>
            <tr>
                <td>Tuesday</td>
                <td>CSS Styling and Layout Essentials</td>
            </tr>
            <tr>
                <td>Wednesday</td>
                <td>Responsive Design Principles</td>
            </tr>
            <tr>
                <td>Thursday</td>
                <td>JavaScript Basics & DOM Manipulation</td>
            </tr>
            <tr>
                <td>Friday</td>
                <td>Project Building & Code Review</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
