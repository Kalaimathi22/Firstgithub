<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Button</title>
</head>
<body>
    <h1>Do you like Candies</h1>
    <button class="smooth-button">Yes</button>
    <button class="smooth-button">No</button>
<style>
  .smooth-button {
    padding: 12px 20px;
    background-color: royalblue;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.3s ease, transform 0.3s ease;
  }

  .smooth-button:hover {
    background-color: darkblue;
    transform: scale(1.1);
  }
</style>
</body>
</html>
