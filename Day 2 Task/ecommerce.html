<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Listing</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-4">
  <!-- Filter Buttons -->
  <div class="btn-group mb-4">
    <button class="btn btn-outline-primary">All</button>
    <button class="btn btn-outline-primary">Category 1</button>
    <button class="btn btn-outline-primary">Category 2</button>
  </div>

  <!-- Product Grid -->
  <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
    <!-- Product Card -->
    <div class="col">
      <div class="card h-100 text-center">
        <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product 1">
        <div class="card-body">
          <h5>Product 1</h5>
          <p>Rs. 1500</p>
          <button class="btn btn-primary">Add to Cart</button>
          <button class="btn btn-outline-secondary mt-2" data-bs-toggle="modal" data-bs-target="#quickView">Quick View</button>
        </div>
      </div>
    </div>
    <!-- Repeat for more products -->
    <div class="col">
      <div class="card h-100 text-center">
        <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product 2">
        <div class="card-body">
          <h5>Product 2</h5>
          <p>Rs. 2000</p>
          <button class="btn btn-primary">Add to Cart</button>
          <button class="btn btn-outline-secondary mt-2" data-bs-toggle="modal" data-bs-target="#quickView">Quick View</button>
        </div>
      </div>
    </div>
    <!-- Add 4 more products similarly -->
  </div>
</div>

<!-- Quick View Modal -->
<div class="modal fade" id="quickView" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5>Product Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <img src="https://via.placeholder.com/400x250" class="img-fluid mb-3" alt="Product Detail">
        <p><strong>Name:</strong> Sample Product</p>
        <p><strong>Price:</strong> $29.99</p>
        <p><strong>Description:</strong> Quick view of product details.</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary">Add to Cart</button>
        <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
