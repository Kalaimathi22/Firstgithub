
    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Center Div with Flexbox</title>
  <style>
    /* Remove default page margins */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;  /* horizontal */
      align-items: center; /* vertical */
      background-color: #f0f0f0;
    }

    /* The div you want to center */
    .centered-div {
      width: 200px;
      height: 200px;
      background-color: #3498db;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="centered-div">Centered!</div>
</body>
</html>

</body>
</html>
