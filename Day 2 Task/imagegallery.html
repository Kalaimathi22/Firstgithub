<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
</head>
<body>
   <div class="gallery">
  <img src="car1.jpg" alt="Car">
  <img src="car2.jpg" alt="Photo 2">
  <img src="car3.jpg" alt="Photo 3">
  <img src="car4.jpg" alt="Photo 4">
</div>

<style>
  .gallery {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  .gallery img {
    width: 100%;
    height: 180px;
    object-fit: cover;
  }

  @media (max-width: 800px) {
    .gallery {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 500px) {
    .gallery {
      grid-template-columns: 1fr;
    }
  }
</style>
</body>
</html>
