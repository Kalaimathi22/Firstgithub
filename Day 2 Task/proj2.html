<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pricing Plans</title>
  <link rel="stylesheet" href="style1.css">
</head>
<body>

  <header>
    <h1>Our Pricing</h1>
  </header>

  <main class="pricing-grid">
    <!-- Basic Plan -->
    <div class="card">
      <h2>Basic</h2>
      <p class="price">Rs. 4000 / mo</p>
      <ul>
        <li>✔ 5 Projects</li>
        <li>✔ Basic Support</li>
        <li>✔ Community Access</li>
      </ul>
      <button>Sign Up</button>
    </div>

    <!-- Pro Plan (highlighted) -->
    <div class="card pro">
      <div class="badge">Most Popular</div>
      <h2>Pro</h2>
      <p class="price">Rs. 8000 / mo</p>
      <ul>
        <li>✔ 20 Projects</li>
        <li>✔ Priority Support</li>
        <li>✔ Advanced Features</li>
      </ul>
      <button>Sign Up</button>
    </div>

    <!-- Premium Plan -->
    <div class="card">
      <h2>Premium</h2>
      <p class="price">Rs. 10000  / mo</p>
      <ul>
        <li>✔ Unlimited Projects</li>
        <li>✔ 24/7 Support</li>
        <li>✔ All Features Included</li>
      </ul>
      <button>Sign Up</button>
    </div>
  </main>

</body>
</html>
