<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pricing Table</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container my-5">
    <h2 class="text-center mb-4">Our Pricing Plans</h2>
    <div class="row text-center">
      
      <!-- Basic Plan -->
      <div class="col-md-4 mb-4">
        <div class="card h-100">
          <div class="card-header bg-light">
            <h4 class="my-0">Basic</h4>
          </div>
          <div class="card-body">
            <h1 class="card-title pricing-card-title">$9 <small class="text-muted">/mo</small></h1>
            <ul class="list-unstyled mt-3 mb-4">
              <li>✔ 5 Projects</li>
              <li>✔ Basic Support</li>
              <li>✔ Access to Community</li>
            </ul>
            <button class="btn btn-outline-primary w-100">Sign Up</button>
          </div>
        </div>
      </div>

      <!-- Pro Plan -->
      <div class="col-md-4 mb-4">
        <div class="card h-100 border-primary">
          <div class="card-header bg-primary text-white">
            <h4 class="my-0">Pro</h4>
          </div>
          <div class="card-body">
            <h1 class="card-title pricing-card-title">$29 <small class="text-muted">/mo</small></h1>
            <ul class="list-unstyled mt-3 mb-4">
              <li>✔ 20 Projects</li>
              <li>✔ Priority Support</li>
              <li>✔ Advanced Features</li>
            </ul>
            <button class="btn btn-primary w-100">Sign Up</button>
          </div>
        </div>
      </div>

      <!-- Premium Plan -->
      <div class="col-md-4 mb-4">
        <div class="card h-100">
          <div class="card-header bg-light">
            <h4 class="my-0">Premium</h4>
          </div>
          <div class="card-body">
            <h1 class="card-title pricing-card-title">$49 <small class="text-muted">/mo</small></h1>
            <ul class="list-unstyled mt-3 mb-4">
              <li>✔ Unlimited Projects</li>
              <li>✔ 24/7 Support</li>
              <li>✔ All Features Included</li>
            </ul>
            <button class="btn btn-outline-primary w-100">Sign Up</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
