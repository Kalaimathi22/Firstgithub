<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Landing Page with Carousel</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Hero Section with Carousel -->
  <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
    <!-- Indicators -->
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="0" class="active"></button>
      <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="1"></button>
      <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="2"></button>
    </div>

    <!-- Slides -->
    <div class="carousel-inner">
      <!-- Slide 1 -->
      <div class="carousel-item active">
        <img src="https://encrypted-tbn0.gstatic.com/shopping?q=tbn:ANd9GcSy56WrAQaosRYsKmzkwG3YmQeaZBObJrSgng0PLbk-ZRlNGuh8qbbO9C4KNPGcjErYNXOngAX2_Gd9wlFhgnw2i7gurQm1jQ" class="d-block w-100" alt="Slide 1">
        <div class="carousel-caption d-none d-md-block">
          <h1>Welcome to My App</h1>
          <p>Simple and responsive design with Bootstrap.</p>
        </div>
      </div>
      <!-- Slide 2 -->
      <div class="carousel-item">
        <img src="https://encrypted-tbn2.gstatic.com/shopping?q=tbn:ANd9GcQEmInrnoOm9lCdkWB2wYW5cHxRT5wZf0-f_5EvsowN9qBxRQDAcTIf5OYTUQz_lR_OTwumHRpX55U28Riq_fNdRVuuSBWPJvI87TQhmEej7ufnw3UT70IU" class="d-block w-100" alt="Slide 2">
        <div class="carousel-caption d-none d-md-block">
          <h1>Fast & Easy</h1>
          <p>Quick setup and beginner‑friendly layout.</p>
        </div>
      </div>
      <!-- Slide 3 -->
      <div class="carousel-item">
        <img src="https://encrypted-tbn3.gstatic.com/shopping?q=tbn:ANd9GcThDRUNHsxjeebu0BMunV5vkd9A3BNglrmJ8peZ3dnWRbYBns5Ku-Jore0nHDO5Emwl_cm75rwPEUowdRbj80UicUeoLLebtyzg1hRVfruF" class="d-block w-100" alt="Slide 3">
        <div class="carousel-caption d-none d-md-block">
          <h1>Get Started Today</h1>
          <p>Build your landing page in minutes.</p>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
