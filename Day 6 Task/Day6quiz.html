<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quiz App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 20px;
    }
    .quiz-container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
      border: 2px solid #333;
      border-radius: 8px;
    }
    .question {
      font-weight: bold;
      margin-bottom: 15px;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option {
      padding: 10px;
      border: 1px solid #333;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .option.correct {
      background-color: #4CAF50;
      color: white;
    }
    .option.wrong {
      background-color: #f44336;
      color: white;
    }
    .score {
      margin-top: 20px;
      font-weight: bold;
    }
    .final {
      font-size: 1.2em;
      margin-top: 20px;
      color: #007bff;
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <div id="question" class="question"></div>
  <div id="options" class="options"></div>
  <div id="score" class="score">Score: 0</div>
  <div id="final" class="final"></div>
</div>

<script>
  // Store questions and answers in an array of objects
  const quizData = [
    {
      question: "What is the capital of France?",
      options: ["Paris", "London", "Berlin"],
      answer: "Paris"
    },
    {
      question: "Which language runs in a web browser?",
      options: ["Python", "Java", "JavaScript", "C++"],
      answer: "JavaScript"
    },
    {
      question: "What does CSS stand for?",
      options: ["Cascading Style Sheets", "Computer Style System", "Creative Style Syntax"],
      answer: "Cascading Style Sheets"
    },
    {
      question: "Which company developed React?",
      options: ["Google", "Facebook", "Microsoft"],
      answer: "Facebook"
    },
    {
      question: "What year was JavaScript created?",
      options: ["1995", "2000", "1990"],
      answer: "1995"
    }
  ];

  let currentQuestion = 0;
  let score = 0;

  const questionEl = document.getElementById("question");
  const optionsEl = document.getElementById("options");
  const scoreEl = document.getElementById("score");
  const finalEl = document.getElementById("final");

  function loadQuestion() {
    if (currentQuestion < quizData.length) {
      const q = quizData[currentQuestion];
      questionEl.textContent = q.question;
      optionsEl.innerHTML = "";
      q.options.forEach(opt => {
        const btn = document.createElement("div");
        btn.textContent = opt;
        btn.classList.add("option");
        btn.addEventListener("click", () => checkAnswer(btn, q.answer));
        optionsEl.appendChild(btn);
      });
    } else {
      questionEl.textContent = "";
      optionsEl.innerHTML = "";
      finalEl.textContent = `You scored ${score}/${quizData.length}`;
    }
  }

  function checkAnswer(selected, correctAnswer) {
    const options = document.querySelectorAll(".option");
    options.forEach(opt => opt.style.pointerEvents = "none"); // disable further clicks

    if (selected.textContent === correctAnswer) {
      selected.classList.add("correct");
      score++;
    } else {
      selected.classList.add("wrong");
      options.forEach(opt => {
        if (opt.textContent === correctAnswer) {
          opt.classList.add("correct");
        }
      });
    }

    scoreEl.textContent = `Score: ${score}`;
    setTimeout(() => {
      currentQuestion++;
      loadQuestion();
    }, 1000);
  }

  // Load the first question
  loadQuestion();
</script>

</body>
</html>
