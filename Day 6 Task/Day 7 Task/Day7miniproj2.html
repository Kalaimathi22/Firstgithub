<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Joke App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    #jokeCard {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #f9f9f9;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
      font-size: 18px;
      font-style: italic;
    }
    #error {
      color: red;
      margin-top: 10px;
      font-weight: bold;
    }
    button {
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h2>Random Joke Generator</h2>
  <button id="jokeBtn">Get New Joke</button>
  <div id="jokeCard"></div>
  <div id="error"></div>

  <script>
    async function fetchJoke() {
      const jokeBtn = document.getElementById("jokeBtn");
      const jokeCard = document.getElementById("jokeCard");
      const errorDiv = document.getElementById("error");

      try {
        // Disable button while fetching
        jokeBtn.disabled = true;
        jokeCard.textContent = "Loading...";
        errorDiv.textContent = "";

        // Fetch joke from public API
        const response = await fetch("https://official-joke-api.appspot.com/random_joke");

        if (!response.ok) {
          throw new Error("Failed to fetch joke");
        }

        const data = await response.json();

        // Display joke
        jokeCard.textContent = `${data.setup} — ${data.punchline}`;
      } catch (error) {
        errorDiv.textContent = "Oops! Couldn't fetch a joke. Please try again.";
        console.error("Error fetching joke:", error);
      } finally {
        // Re-enable button
        jokeBtn.disabled = false;
      }
    }

    // Add event listener
    document.getElementById("jokeBtn").addEventListener("click", fetchJoke);
  </script>
</body>
</html>
