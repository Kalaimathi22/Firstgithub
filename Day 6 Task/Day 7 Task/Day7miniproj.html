<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inspirational Quotes</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    #quoteCard {
      border: 2px solid #333;
      padding: 20px;
      margin: 20px auto;
      width: 60%;
      border-radius: 8px;
      background: #f9f9f9;
      font-size: 20px;
      font-style: italic;
    }
    #loading {
      font-size: 18px;
      color: blue;
    }
    #error {
      color: red;
      margin-top: 10px;
    }
    button {
      margin-top: 15px;
      padding: 10px 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>✨ Inspirational Quotes ✨</h1>
  <div id="loading">Loading...</div>
  <div id="quoteCard"></div>
  <div id="error"></div>
  <button id="newQuote">New Quote</button>

  <script>
    const quoteCard = document.getElementById("quoteCard");
    const loadingMsg = document.getElementById("loading");
    const errorMsg = document.getElementById("error");
    const newQuoteBtn = document.getElementById("newQuote");

    const fallbackQuote = `"Keep pushing forward, no matter what." — Unknown`;

    async function fetchQuote() {
      try {
        // Show loading
        loadingMsg.style.display = "block";
        errorMsg.textContent = "";
        quoteCard.textContent = "";
        newQuoteBtn.disabled = true;

        // Add a cache-busting query parameter so each request is unique
        const response = await fetch("https://api.quotable.io/random?tags=inspirational&" + Date.now());

        if (!response.ok) {
          throw new Error("Network error");
        }

        const data = await response.json();

        // Hide loading
        loadingMsg.style.display = "none";
        newQuoteBtn.disabled = false;

        // Show quote
        quoteCard.textContent = `"${data.content}" — ${data.author}`;
      } catch (error) {
        // Hide loading and show fallback
        loadingMsg.style.display = "none";
        newQuoteBtn.disabled = false;
        errorMsg.textContent = "Could not fetch a new quote. Showing a default one:";
        quoteCard.textContent = fallbackQuote;
        console.error("Error fetching quote:", error);
      }
    }

    // Load first quote on page load
    window.addEventListener("load", fetchQuote);

    // Fetch new quote on button click
    newQuoteBtn.addEventListener("click", fetchQuote);
  </script>
</body>
</html>
