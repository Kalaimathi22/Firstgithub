<!DOCTYPE html>
<html>
<head>
  <title>Async/Await Fetch Example</title>
</head>
<body>
  <!-- Loading message -->
  <h2 id="postTitle">Loading...</h2>

  <script>
    // Async function to fetch a single post
    async function getPost() {
      try {
        // Show loading message
        const titleElement = document.getElementById("postTitle");
        titleElement.textContent = "Loading...";

        // Fetch post with ID 1
        const response = await fetch("https://jsonplaceholder.typicode.com/posts/1");
        
        // Convert response to JSON
        const post = await response.json();
        
        // Replace loading message with the post title
        titleElement.textContent = post.title;
      } catch (error) {
        document.getElementById("postTitle").textContent = "Error fetching post!";
        console.error("Error fetching post:", error);
      }
    }

    // Call the async function
    getPost();
  </script>
</body>
</html>
