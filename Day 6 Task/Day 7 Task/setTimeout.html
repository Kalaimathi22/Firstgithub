<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeout</title>
</head>
<body>
    <script>
    console.log("This runs first!");

// Schedule 'Welcome!' after 3 seconds
setTimeout(() => {
  console.log("Welcome!");
}, 3000);

console.log("This runs second, before 'Welcome!'");
</script>
</body>
</html>
